[project]
name = "mapper-nomino"
version = "0.0.1"
description = "mapper-nomino"
authors = [{ name = "senzing", email = "support@senzing.com" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = [
  "LICENSE",
  ".github/senzing-corporate-contributor-license-agreement.pdf",
  ".github/senzing-individual-contributor-license-agreement.pdf",
]

[project.urls]
bugtracker = "https://github.com/senzing/mapper-nomino/issues"
changelog = "https://github.com/senzing/mapper-nomino/blob/main/CHANGELOG.md"
source = "https://github.com/senzing/mapper-nomino"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
all = [
  { include-group = "development" },
  { include-group = "documentation" },
  { include-group = "lint" },
  { include-group = "test" },
]
development = [
  "build==1.6.1",
  "coverage==7.16.2",
  "cryptography==50.0.2",
  "psutil==7.2.2",
  "pytest-cov==7.1.0",
  "pytest-schema==0.1.2",
  "pytest==9.2.0",
  "twine==7.0.0",
  "virtualenv==21.15.1",
  "wheel==0.48.0",
]
documentation = [
  "autodocsumm==0.2.15",
  "myst_parser==4.0.1",
  "sphinx==8.2.3",
  "sphinx-autodoc-typehints==3.5.1",
  "sphinx-gallery==0.22.1",
  "sphinx-jinja2-compat==0.4.1",
  "sphinx-prompt==1.10.2",
  "sphinx-rtd-theme==3.1.0",
  "sphinx-tabs>=3.4,<3.6",
  "sphinx-toolbox==4.3.1",
  "sphinxcontrib-applehelp==2.0.0",
  "sphinxcontrib-devhelp==2.0.0",
  "sphinxcontrib-htmlhelp==2.1.0",
  "sphinxcontrib-jquery==4.1",
  "sphinxcontrib-jsmath==2.0.0",
  "sphinxcontrib-qthelp==2.0.0",
  "sphinxcontrib-serializinghtml==2.0.0",
  "sphinxext-remoteliteralinclude==0.6.1",
]
lint = [
  "bandit==1.9.4",
  "black==26.10.1",
  "flake8==7.4.1",
  "isort==9.0.2",
  "mypy==2.4.1",
  "pylint==4.1.3",
  "pylint-per-file-ignores==3.2.1",
]
test = [
  "pytest==9.2.0",
  "coverage==7.16.2",
]

[tool.bandit]
skips = ["B101"]

[tool.black]
line-length = 120

[tool.flake8]
extend-ignore = ["E203", "E704"]
max-line-length = 120

[tool.isort]
profile = "black"
src_paths = ["examples", "src", "tests"]

[tool.pylint]
ignored-argument-names = "args|kwargs"
disable = [
  "consider-using-with",
  "invalid-name",
  "line-too-long",
  "too-many-branches",
  "too-many-lines",
  "too-many-statements",
  "unspecified-encoding",
]
good-names = ["mapper-nomino"]
ignore = ["__init__.py", "docs/source/conf.py"]
notes = ["FIXME"]
